<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMIT Master of Artificial Intelligence - AI Arm Race in Digital Banking</title>
    
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            margin: 0;
        }
        h1 { 
            text-align: center; 
            color: #58a6ff; 
            text-transform: uppercase;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
            font-size: 1.8em;
        }
        .status-bar { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 0.9em; 
            color: #8b949e;
        }
        table { 
            width: 100%; 
            max-width: 900px; 
            margin: 0 auto; 
            border-collapse: collapse; 
            background-color: #161b22; 
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #30363d; 
        }
        th { 
            background-color: #21262d; 
            color: #f0f6fc;
            font-weight: bold;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #21262d;
        }
        .health-high { color: #7ee787; font-weight: bold; }
        .health-mid { color: #dbab09; font-weight: bold; }
        .health-low { color: #ff7b72; font-weight: bold; }
        
        .breach-badge {
            background-color: #30363d;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 3px;
            color: #ff7b72;
        }
    </style>
</head>
<body>

    <h1>RMIT Master of Artificial Intelligence - AI Arm Race in Digital Banking</h1>
    <div class="status-bar">
        SYSTEM STATUS: <span id="conn-status" style="color:#f78166">CONNECTING...</span> | 
        LAST UPDATE: <span id="sync-time" style="color:#58a6ff">-</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Unit (Pair)</th>
                <th>🛡️ System Health</th>
                <th>Files Breached</th>
                <th>Last Activity</th>
            </tr>
        </thead>
        <tbody id="board-body">
            <tr><td colspan="4" style="text-align:center;">📡 Establishing Secure Uplink...</td></tr>
        </tbody>
    </table>

    <!-- 🔧 THE FIX: Mapped the complete strict URL directories -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://gstatic.com";

        const firebaseConfig = {
            databaseURL: "https://mai-workshop-rmit2026-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const leaderboardRef = ref(db, 'leaderboard');
        
        onValue(leaderboardRef, (snapshot) => {
            const data = snapshot.val();
            
            const statusEl = document.getElementById('conn-status');
            statusEl.innerText = "ONLINE";
            statusEl.style.color = "#2ea043";
            
            if (data) {
                updateTable(data);
                document.getElementById('sync-time').innerText = new Date().toLocaleTimeString();
            } else {
                const tbody = document.getElementById('board-body');
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">⚠️ Database is empty. Waiting for first sync...</td></tr>`;
            }
        }, (error) => {
            console.error("Firebase Read Error:", error);
            document.getElementById('conn-status').innerText = "ERROR";
        });

        function updateTable(data) {
            const tbody = document.getElementById('board-body');
            tbody.innerHTML = ""; 

            let pairs = Object.entries(data);

            let rows = pairs.map(([pairName, stats]) => {
                let filesBreachedCount = 0;
                let filesArray = [];

                if (stats.files_breached) {
                    if (Array.isArray(stats.files_breached)) {
                        filesArray = stats.files_breached;
                    } else if (typeof stats.files_breached === 'object') {
                        filesArray = Object.values(stats.files_breached);
                    }
                    filesBreachedCount = filesArray.length;
                }
                
                let currentHealth = 100 - (filesBreachedCount * 10);
                if (currentHealth < 0) currentHealth = 0;

                return {
                    name: pairName,
                    health: currentHealth,
                    files: filesArray,
                    last: stats.last_active || 'Never'
                };
            });

            rows.sort((a, b) => a.health - b.health);

            rows.forEach((row) => {
                const tr = document.createElement('tr');
                
                let filesHtml = '-';
                if (row.files.length > 0) {
                    filesHtml = row.files.map(f => `<span class="breach-badge">#${f}</span>`).join(' ');
                }

                let healthClass = "health-high";
                if (row.health <= 30) healthClass = "health-low";
                else if (row.health <= 70) healthClass = "health-mid";

                tr.innerHTML = `
                    <td style="font-weight:bold;">${row.name}</td>
                    <td class="${healthClass}">${row.health}%</td>
                    <td>${filesHtml}</td>
                    <td style="color:#8b949e; font-size:0.9em;">${row.last}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
