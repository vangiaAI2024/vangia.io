name: Sync JSONBin to Firebase

on:
  workflow_dispatch: 
    # Manual execution trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Python Sync Script
        run: |
          pip install requests
          
          python -c "
          import os
          import requests

          try:
              if not os.environ.get('FIREBASE_DB_SECRET'):
                  raise Exception('MISSING SECRET: FIREBASE_DB_SECRET')
              if not os.environ.get('JSONBIN_KEY'):
                  raise Exception('MISSING SECRET: JSONBIN_KEY')

              print('📡 Fetching scores from JSONBin.io...')
              
              # 🔥 HARDCODED FALLBACK URL (Sanitized without dynamic string injections)
              jsonbin_url = 'https://api.jsonbin.io/v3/b/'
              
              # Strip keys of any accidental spacing
              jsonbin_headers = {'X-Access-Key': os.environ.get('JSONBIN_KEY').strip()}
              
              res = requests.get(jsonbin_url, headers=jsonbin_headers)
              
              # 🔍 DEBUGGING BLOCK: If it isn't JSON, see what it actually is!
              if res.status_code != 200:
                  print(f'❌ JSONBin Server Error. Code: {res.status_code}')
                  print(f'❌ Raw Server Response:\n{res.text[:500]}')
                  exit(1)
              
              try:
                  payload_data = res.json()['record']
              except Exception as json_err:
                  print(f'❌ JSON Decode Error! Raw Text was:\n{res.text[:500]}')
                  raise json_err

              print('💾 Pushing data state to Firebase...')
              
              db_secret = os.environ.get('FIREBASE_DB_SECRET').strip()
              db_url = f'https://firebasedatabase.app{db_secret}'
              
              put_res = requests.put(db_url, json=payload_data)
              
              if put_res.status_code == 200:
                  print('✅ Sync completed successfully!')
              else:
                  print(f'❌ Firebase rejected write. Code: {put_res.status_code}. Response: {put_res.text}')
                  exit(1)

          except Exception as e:
              print(f'❌ CRITICAL FAILURE: {e}')
              exit(1)
          "
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
