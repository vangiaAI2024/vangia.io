name: Sync JSONBin to Firebase

on:
  schedule:
    # Triggers an automated update every 5 minutes (GitHub minimum)
    - cron: '*/5 * * * *' 
  workflow_dispatch: 
    # Enables the "Run workflow" button for manual on-demand execution

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Run Sync Script
        run: |
          # 1. Install required network and database libraries
          npm install axios firebase-admin
          
          # 2. Create the execution script dynamically
          cat <<EOF > sync.js
          const axios = require('axios');
          const admin = require('firebase-admin');
          
          // Parse the secret service account from GitHub environment
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          
          // Initialize connection to your Singapore Firebase Server
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: "https://firebasedatabase.app"
          });
          
          async function run() {
            try {
              console.log("📡 Fetching latest scores from JSONBin.io...");
              
              // Mapped directly to your Scoreboard Bin ID
              const res = await axios.get("https://jsonbin.io", {
                headers: { "X-Access-Key": process.env.JSONBIN_KEY }
              });
              
              console.log("💾 Pushing data state over to Firebase Realtime Database...");
              
              // This strictly overwrites the 'leaderboard' path on your tree
              await admin.database().ref("leaderboard").set(res.data.record);
              
              console.log("✅ Sync completed successfully!");
              process.exit(0);
            } catch (e) {
              console.error("❌ Error during execution state:", e.message);
              process.exit(1);
            }
          }
          run();
          EOF
          
          # 3. Execute the script
          node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
