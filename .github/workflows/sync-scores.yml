name: Sync JSONBin to Firebase

on:
  workflow_dispatch: 
    # Manual execution trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Python Sync Script
        run: |
          pip install requests
          
          python -c "
          import os
          import requests
          import json

          try:
              if not os.environ.get('JSONBIN_KEY'):
                  raise Exception('MISSING SECRET: JSONBIN_KEY')

              print('📡 Fetching scores from JSONBin.io...')
              
              # Hardcoded target to lock out API routing crashes
              jsonbin_url = 'https://api.jsonbin.io'
              
              # Strictly mapped to official v3 standards
              jsonbin_headers = {
                  'X-Access-Key': os.environ.get('JSONBIN_KEY').strip(),
                  'X-Bin-Meta': 'false',
                  'Content-Type': 'application/json'
              }
              
              res = requests.get(jsonbin_url, headers=jsonbin_headers)
              
              if res.status_code != 200:
                  print(f'❌ JSONBin Server Error. Code: {res.status_code}')
                  print(f'❌ Server Message:\n{res.text[:500]}')
                  exit(1)
              
              try:
                  payload_data = res.json()
              except Exception as json_err:
                  print('❌ JSON Decode Failure!')
                  print(f'❌ Raw Text received from server:\n{res.text[:500]}')
                  raise json_err

              print('💾 Pushing data state to Firebase...')
              
              # 🔧 THE ULTIMATE FIX: Hardcoding the parameters directly into the string!
              # This physically prevents Python from smashing variables onto the end of '.app'
              db_url = 'https://firebasedatabase.app'
              
              put_res = requests.put(db_url, json=payload_data)
              
              if put_res.status_code == 200:
                  print('✅ Sync completed successfully!')
              else:
                  print(f'❌ Firebase rejected write. Code: {put_res.status_code}. Response: {put_res.text}')
                  exit(1)

          except Exception as e:
              print(f'❌ CRITICAL FAILURE: {e}')
              exit(1)
          "
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
