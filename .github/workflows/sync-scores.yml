name: Sync JSONBin to Firebase

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual run

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6 # 👈 Updated from @v4 to @v6 for Node 24 support
        with:
          node-version: '24' # 👈 Updated from '22' to '24'
          
      - name: Run Sync Script
        run: |
          npm install axios firebase-admin
          
          cat <<EOF > sync.js
          const axios = require('axios');
          const admin = require('firebase-admin');
          
          async function run() {
            try {
              // Safety Check - Verify Secrets exist before crashing
              if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
                throw new Error("MISSING SECRET: 'FIREBASE_SECRET' is empty. Check GitHub Settings!");
              }
              if (!process.env.JSONBIN_KEY) {
                throw new Error("MISSING SECRET: 'JSONBIN_KEY' is empty. Check GitHub Settings!");
              }

              // Parse Credentials
              const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
              
              // Initialize Firebase
              admin.initializeApp({
                credential: admin.credential.cert(serviceAccount),
                databaseURL: "https://firebasedatabase.app"
              });
          
              console.log("📡 Fetching latest scores from JSONBin.io...");
              
              // Target your Scoreboard Bin ID
              const res = await axios.get("https://jsonbin.io", {
                headers: { "X-Access-Key": process.env.JSONBIN_KEY }
              });
              
              console.log("💾 Pushing data to Firebase...");
              await admin.database().ref("leaderboard").set(res.data.record);
              
              console.log("✅ Sync completed successfully!");
              process.exit(0);
            } catch (e) {
              console.error("❌ CRITICAL FAILURE:", e.message);
              process.exit(1);
            }
          }
          run();
          EOF
          
          node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
