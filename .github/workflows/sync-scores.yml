name: Sync JSONBin to Firebase

on:
  # 1. 🗑️ Automated 'cron' schedule deleted to prevent automatic network drain
  workflow_dispatch: 
    # 2. 🟢 Manual execution button retained. This yields pure on-demand pushes.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Python Sync Script
        run: |
          pip install requests google-auth
          
          python -c "
          import os
          import json
          import requests
          from google.oauth2 import service_account
          from google.auth.transport import requests as google_requests

          try:
              if not os.environ.get('FIREBASE_SERVICE_ACCOUNT'):
                  raise Exception('MISSING SECRET: FIREBASE_SECRET')
              if not os.environ.get('JSONBIN_KEY'):
                  raise Exception('MISSING SECRET: JSONBIN_KEY')

              print('🔒 Generating secure token...')
              service_account_info = json.loads(os.environ.get('FIREBASE_SERVICE_ACCOUNT'))
              credentials = service_account.Credentials.from_service_account_info(
                  service_account_info,
                  scopes=['https://googleapis.com', 'https://googleapis.com']
              )
              
              request = google_requests.Request()
              credentials.refresh(request)
              access_token = credentials.token

              print('📡 Fetching scores from JSONBin.io...')
              headers = {'X-Access-Key': os.environ.get('JSONBIN_KEY')}
              res = requests.get('https://jsonbin.io', headers=headers)
              
              if res.status_code != 200:
                  raise Exception(f'JSONBin rejected access: {res.text}')
              
              payload_data = res.json()['record']

              print('💾 Pushing data state to Firebase...')
              db_url = 'https://firebasedatabase.app'
              
              firebase_headers = {
                  'Authorization': f'Bearer {access_token}',
                  'Content-Type': 'application/json'
              }
              
              put_res = requests.put(db_url, json=payload_data, headers=firebase_headers)
              
              if put_res.status_code == 200:
                  print('✅ Sync completed successfully!')
              else:
                  print(f'❌ Firebase rejected write. Code: {put_res.status_code}. Response: {put_res.text}')
                  exit(1)

          except Exception as e:
              print(f'❌ CRITICAL FAILURE: {e}')
              exit(1)
          "
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
