name: Sync JSONBin to Firebase

on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          
      - name: Run Sync Script
        run: |
          npm install axios firebase-admin
          
          cat <<EOF > sync.js
          const axios = require('axios');
          const admin = require('firebase-admin');
          
          async function run() {
            try {
              if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
                throw new Error("MISSING SECRET: 'FIREBASE_SECRET' is empty.");
              }
              if (!process.env.JSONBIN_KEY) {
                throw new Error("MISSING SECRET: 'JSONBIN_KEY' is empty.");
              }

              const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
              
              // 1. Initialize Firebase App (used strictly to generate a secure access token)
              const app = admin.initializeApp({
                credential: admin.credential.cert(serviceAccount)
              });
              
              const tokenObject = await app.options.credential.getAccessToken();
              const accessToken = tokenObject.access_token;
          
              console.log("📡 Fetching latest scores from JSONBin.io...");
              const res = await axios.get("https://jsonbin.io", {
                headers: { "X-Access-Key": process.env.JSONBIN_KEY }
              });
              
              console.log("💾 Pushing data directly to Firebase REST API...");
              
              // 2. Bypass Firebase SDK bugs by calling the HTTP REST API directly
              const dbUrl = "https://firebasedatabase.app";
              
              const pushResponse = await axios.put(dbUrl, res.data.record, {
                headers: {
                  'Authorization': `Bearer ${accessToken}`,
                  'Content-Type': 'application/json'
                }
              });
              
              if (pushResponse.status === 200) {
                 console.log("✅ Sync completed successfully!");
              } else {
                 console.error("❌ Firebase rejected the HTTP write request.");
              }
              
              process.exit(0);
            } catch (e) {
              console.error("❌ CRITICAL FAILURE:", e.message);
              process.exit(1);
            }
          }
          run();
          EOF
          
          node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
