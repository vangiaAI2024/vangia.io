<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMIT Master of Artificial Intelligence - AI Arm Race in Digital Banking</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');

        body {
            background-color: #ffffff;
            color: #111827;
            font-family: 'Space Mono', monospace;
            padding: 20px;
            margin: 0;
            line-height: 1.8;
        }

        header {
            background-color: #ffffff;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .logo {
            display: inline-flex;
            align-items: center;
        }

        .logo img {
            height: 40px;
            width: auto;
            display: block;
        }

        ul {
            list-style: none;
            display: flex;
            gap: 24px;
            align-items: center;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
        }

        li {
            position: relative;
            font-size: 0.98rem;
            letter-spacing: 0.01em;
        }

        li > a {
            color: #111827;
            text-decoration: none;
            padding: 6px 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        li > a:hover {
            color: #2563eb;
        }

        .dropdown::after {
            content: "▾";
            font-size: 0.7rem;
            color: #6b7280;
            transition: transform 0.2s ease;
            margin-left: 6px;
        }

        .dropdown:hover::after {
            transform: rotate(180deg);
        }

        .submenu {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            background: #ffffff;
            min-width: 200px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
            padding: 12px 0;
            z-index: 1000;
            min-width: 220px;
            overflow: hidden;
        }

        .dropdown:hover .submenu,
        .submenu.show {
            display: block;
        }

        .submenu li {
            margin: 0;
            padding: 0;
        }

        .submenu li a {
            display: block;
            padding: 12px 18px;
            color: #111827;
            font-size: 0.95rem;
            font-family: 'Space Mono', monospace;
        }

        .submenu li a:hover {
            background: #f8fafc;
            color: #2563eb;
        }

        .status-bar {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #6b7280;
            background-color: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            color: #374151;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .health-high { color: #059669; font-weight: 600; }
        .health-mid { color: #d97706; font-weight: 600; }
        .health-low { color: #dc2626; font-weight: 600; }

        .breach-badge {
            background-color: #fef3c7;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 3px;
            color: #92400e;
            border: 1px solid #f59e0b;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">
                <img src="logo.jpeg" alt="Vangia.io">
            </a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#features">Features</a></li>
                <li class="dropdown">
                    <a href="#about">About</a>
                    <ul class="submenu">
                        <li><a href="#company">Dr. Hoang Van</a></li>
                        <li><a href="#blog">Success Stories</a></li>
                        <li><a href="#support">FAQ</a></li>
                        <li><a href="events.html">Live Demo</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <h1>RMIT Master of Artificial Intelligence - AI Arm Race in Digital Banking</h1>
    <div class="status-bar">
        SYSTEM STATUS: <span id="conn-status" style="color:#f78166">CONNECTING...</span> | 
        LAST UPDATE: <span id="sync-time" style="color:#58a6ff">-</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Unit (Pair)</th>
                <th>🛡️ System Health</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="board-body">
            <tr><td colspan="3" style="text-align:center;">📡 Establishing Secure Uplink...</td></tr>
        </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://mai-workshop-rmit2026-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoresRef = ref(db, 'pages/scores');

        const connStatusEl = document.getElementById('conn-status');
        const syncTimeEl = document.getElementById('sync-time');
        const tbody = document.getElementById('board-body');

        function setConnection(status, color) {
            connStatusEl.innerText = status;
            connStatusEl.style.color = color;
        }

        function showMessage(message) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">${message}</td></tr>`;
        }

        onValue(scoresRef, (snapshot) => {
            const payload = snapshot.val();
            setConnection('ONLINE', '#2ea043');
            syncTimeEl.innerText = new Date().toLocaleTimeString();

            if (!payload || !payload.scores) {
                showMessage('⚠️ No score payload found at /pages/scores. Waiting for sync...');
                return;
            }

            if (!Array.isArray(payload.scores)) {
                showMessage('⚠️ Unexpected data format: expected an array at /pages/scores/scores.');
                return;
            }

            updateTable(payload.scores);
        }, (error) => {
            console.error('Firebase listener error:', error);
            setConnection('OFFLINE', '#f78166');
            showMessage(`❌ Firebase error: ${error?.message || error}`);
        });

        function getHealthClass(value) {
            if (value >= 75) return 'health-high';
            if (value >= 50) return 'health-mid';
            return 'health-low';
        }

        function getStatusLabel(value) {
            if (value >= 75) return 'Secure';
            if (value >= 50) return 'At Risk';
            if (value >= 25) return 'Breached';
            return 'Critical';
        }

        function updateTable(scores) {
            tbody.innerHTML = '';

            const sorted = [...scores].sort((a, b) => (a.score || 0) - (b.score || 0));
            if (sorted.length === 0) {
                showMessage('⚠️ Score list is empty.');
                return;
            }

            sorted.forEach(item => {
                const row = document.createElement('tr');
                const name = item.name || `Pair ${item.pair_id ?? '?'}`;
                const score = Number.isFinite(item.score) ? item.score : 0;
                const status = getStatusLabel(score);
                row.innerHTML = `
                    <td style="font-weight:bold;">${name}</td>
                    <td class="${getHealthClass(score)}">${score}%</td>
                    <td>${status}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
