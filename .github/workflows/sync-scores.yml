name: Sync JSONBin to Firebase

on:
  workflow_dispatch: 
    # Manual execution trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Push Data State
        run: |
          echo "📡 Step 1: Pulling scores from JSONBin.io..."
          
          # We pull the data and save it directly to a file called payload.json
          curl -s -X GET "https://api.jsonbin.io" \
               -H "X-Access-Key: ${{ secrets.JSONBIN_KEY }}" \
               -o payload.json
               
          # Safety check to see if the file grabbed is blank
          if [ ! -s payload.json ]; then
            echo "❌ CRITICAL FAILURE: JSONBin returned an empty file or denied access."
            exit 1
          fi
          
          # 2. DEBUG: Verify the URL matches your console exactly
          echo "🔍 DEBUG: Checking if this domain actually exists..."
          host mai-workshop-rmit2026-default-rtdb.asia-southeast1.firebasedatabase.app || echo "⚠️ WARNING: Domain lookup failed!"
          
          echo "💾 Step 2: Pushing to Singapore Firebase..."
          
          # 🔧 THE ULTIMATE FIX: Wrapping the entire URL in strict single quotes!
          # This prevents the terminal from misinterpreting '?' or '=' as broken hostnames.
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
               'https://firebasedatabase.app' \
               -H "Content-Type: application/json" \
               -d @payload.json)

          if [ "$RESPONSE" == "200" ]; then
            echo "✅ SUCCESS! Data tree updated in Singapore."
          else
            echo "❌ CRITICAL FAILURE: Firebase rejected the write. Status Code: $RESPONSE"
            exit 1
          fi
