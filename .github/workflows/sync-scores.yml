name: Sync JSONBin to Firebase

on:
  workflow_dispatch: 
    # Manual execution trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          
      - name: Run Python Sync Script
        run: |
          # 1. Install standard requests library
          pip install requests
          
          # 2. Execute the bridge in pure Python
          python -c "
          import os
          import json
          import requests

          try:
              # Guardrails to verify both secrets exist in GitHub Settings
              if not os.environ.get('FIREBASE_DB_SECRET'):
                  raise Exception('MISSING SECRET: FIREBASE_DB_SECRET is not in GitHub Settings!')
              if not os.environ.get('JSONBIN_KEY'):
                  raise Exception('MISSING SECRET: JSONBIN_KEY is not in GitHub Settings!')
              if not os.environ.get('JSONBIN_BIN_ID'):
                  raise Exception('MISSING SECRET: JSONBIN_BIN_ID is not in GitHub Settings!')

              # A. Fetch the latest array from JSONBin (v3 Standards)
              print('📡 Fetching scores from JSONBin.io...')

              bin_id = os.environ.get('JSONBIN_BIN_ID').strip()
              jsonbin_url = f'https://api.jsonbin.io/v3/b/{bin_id}'
              jsonbin_headers = {
                  'X-Access-Key': os.environ.get('JSONBIN_KEY').strip(),
                  'Content-Type': 'application/json'
              }
              
              res = requests.get(jsonbin_url, headers=jsonbin_headers)
              
              if res.status_code != 200:
                  print(f'❌ JSONBin Server Error. Code: {res.status_code}')
                  print(f'❌ Raw Server Response:\\n{res.text[:500]}')
                  exit(1)
              
              payload_data = res.json()['record']

              # B. Push natively to your Singapore server endpoint using the Secret Variable
              print('💾 Pushing data state to Firebase...')
              
              # Stripping variable here removes accidental spacing
              db_secret = os.environ.get('FIREBASE_DB_SECRET').strip()
              
              # 🔥 THE FIX: Separated by a clear question mark mapped into the string
              # This tells the server that the domain path has officially ended and a variable is starting
              db_url = f'https://neo-rmit-2026-ai-banking-default-rtdb.asia-southeast1.firebasedatabase.app/pages/scores.json?auth={db_secret}'
              
              put_res = requests.put(db_url, json=payload_data)
              
              if put_res.status_code == 200:
                  print('✅ Sync completed successfully!')
              else:
                  print(f'❌ Firebase rejected write. Code: {put_res.status_code}. Response: {put_res.text}')
                  exit(1)

          except Exception as e:
              print(f'❌ CRITICAL FAILURE: {e}')
              exit(1)
          "
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
