name: Sync JSONBin to Firebase

on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          
      - name: Run Sync Script
        run: |
          # Install required network and database libraries
          npm install axios firebase-admin
          
          cat <<EOF > sync.js
          const axios = require('axios');
          const admin = require('firebase-admin');
          
          async function run() {
            try {
              if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
                throw new Error("MISSING SECRET: 'FIREBASE_SECRET' is empty.");
              }
              if (!process.env.JSONBIN_KEY) {
                throw new Error("MISSING SECRET: 'JSONBIN_KEY' is empty.");
              }

              const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
              
              // 1. Initialize Firebase without specific database URL requirements
              admin.initializeApp({
                credential: admin.credential.cert(serviceAccount)
              });
              
              const db = admin.firestore();
          
              console.log("📡 Fetching latest scores from JSONBin.io...");
              const res = await axios.get("https://jsonbin.io", {
                headers: { "X-Access-Key": process.env.JSONBIN_KEY }
              });
              
              console.log("💾 Pushing data state over to Firestore...");
              
              // 2. Overwrites or creates the document 'current_scores' in the 'leaderboard' collection
              await db.collection("leaderboard").doc("current_scores").set(res.data.record);
              
              console.log("✅ Sync completed successfully!");
              process.exit(0);
            } catch (e) {
              console.error("❌ CRITICAL FAILURE:", e.message);
              process.exit(1);
            }
          }
          run();
          EOF
          
          node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
