name: Sync JSONBin to Firebase

on:
  workflow_dispatch: 
    # Manual execution trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Python Sync Script
        run: |
          pip install requests
          
          python -c "
          import os
          import requests
          import json

          try:
              if not os.environ.get('FIREBASE_DB_SECRET'):
                  raise Exception('MISSING SECRET: FIREBASE_DB_SECRET')
              if not os.environ.get('JSONBIN_KEY'):
                  raise Exception('MISSING SECRET: JSONBIN_KEY')

              print('📡 Fetching scores from JSONBin.io...')
              
              jsonbin_url = 'https://jsonbin.io'
              
              jsonbin_headers = {
                  'X-Access-Key': os.environ.get('JSONBIN_KEY').strip(),
                  'X-Bin-Meta': 'false',
                  'Content-Type': 'application/json'
              }
              
              res = requests.get(jsonbin_url, headers=jsonbin_headers)
              
              # 🚨 CRITICAL CHECK 1: Read the server's status code
              print(f'👉 API Response Status: {res.status_code}')
              
              if res.status_code == 401 or res.status_code == 403:
                  print('❌ Server block! Your JSONBIN_KEY does not have access permissions.')
                  exit(1)
              elif res.status_code == 404:
                  print('❌ Bin not found! The ID 69e1d354856a68218942b374 is incorrect or deleted.')
                  exit(1)
              elif res.status_code != 200:
                  print(f'❌ Server Error. Response text was truncated.')
                  exit(1)
              
              # 🚨 CRITICAL CHECK 2: Safeguard JSON decoding against incoming HTML
              content_type = res.headers.get('Content-Type', '')
              if 'application/json' not in content_type:
                  print('❌ Error: Server returned an HTML web page instead of JSON data.')
                  print('💡 Fix: Generate a fresh Access Key on JSONBin and paste it in your GitHub Secrets.')
                  exit(1)
              
              try:
                  payload_data = res.json()
              except Exception as json_err:
                  print('❌ JSON Decode Failure! The data could not be parsed.')
                  raise json_err

              print('💾 Pushing data state to Firebase...')
              
              db_secret = os.environ.get('FIREBASE_DB_SECRET').strip()
              db_url = f'https://firebasedatabase.app{db_secret}'
              
              put_res = requests.put(db_url, json=payload_data)
              
              if put_res.status_code == 200:
                  print('✅ Sync completed successfully!')
              else:
                  print(f'❌ Firebase rejected write. Code: {put_res.status_code}.')
                  exit(1)

          except Exception as e:
              print(f'❌ CRITICAL FAILURE: {e}')
              exit(1)
          "
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
